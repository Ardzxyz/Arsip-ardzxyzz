<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arsip Kenangan Keabadian</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #05020a;
      --card-bg: rgba(255, 255, 255, 0.04);
      --border-color: rgba(255, 105, 180, 0.25);
      --accent-pink: #ff2a70;
      --accent-rose: #ff758c;
      --accent-gold: #ffd700;
      --text-main: #fff0f5;
      --glow-pink: rgba(255, 42, 112, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
      position: relative;
      transition: filter 0.1s ease, opacity 0.1s ease;
    }

    body.screenshot-shield {
      filter: blur(80px) grayscale(100%) !important;
      opacity: 0.1 !important;
    }

    #anti-screenshot-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 99999;
      display: none;
      justify-content: center;
      align-items: center;
      color: var(--accent-rose);
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      letter-spacing: 3px;
    }

    #stars-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* --- LOGIN OVERLAY --- */
    #login-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 2, 10, 0.88);
      backdrop-filter: blur(20px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }

    .login-card {
      background: rgba(20, 10, 25, 0.5);
      border: 1px solid var(--border-color);
      padding: 45px 35px;
      border-radius: 28px;
      box-shadow: 0 0 30px var(--glow-pink), inset 0 0 20px rgba(255, 42, 112, 0.15);
      text-align: center;
      width: 90%;
      max-width: 400px;
      backdrop-filter: blur(15px);
      position: relative;
      z-index: 10;
    }

    .login-card h2 {
      font-family: 'Cinzel', serif;
      font-weight: 700;
      letter-spacing: 4px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff, var(--accent-rose), var(--accent-gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
    }

    .login-quote {
      font-size: 0.85rem;
      font-style: italic;
      color: var(--accent-gold);
      margin-bottom: 25px;
      opacity: 0.95;
      line-height: 1.5;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
    }

    .login-card input {
      width: 100%;
      padding: 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      color: #fff;
      font-size: 20px;
      text-align: center;
      outline: none;
      margin-bottom: 12px;
      letter-spacing: 8px;
      transition: all 0.3s ease;
    }

    .login-card input:focus {
      border-color: var(--accent-pink);
      box-shadow: 0 0 15px var(--glow-pink);
    }

    .error-msg {
      color: var(--accent-rose);
      font-size: 0.85rem;
      margin-bottom: 15px;
      min-height: 20px;
      font-weight: 500;
      text-shadow: 0 0 8px rgba(255, 117, 140, 0.4);
    }

    .login-card button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent-pink), #a00037);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-weight: 600;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 42, 112, 0.4);
      transition: all 0.3s ease;
    }

    .login-card button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(255, 42, 112, 0.6);
    }

    /* --- GALERI UTAMA --- */
    #main-content {
      display: none;
      width: 100%;
      max-width: 1200px;
      padding: 40px 20px;
      position: relative;
      z-index: 10;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    header h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: 5px;
      background: linear-gradient(135deg, #ffffff 20%, var(--accent-rose) 60%, var(--accent-gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      filter: drop-shadow(0 0 15px rgba(255, 117, 140, 0.3));
    }

    .quote-banner {
      font-size: 0.95rem;
      font-style: italic;
      color: var(--accent-gold);
      padding: 12px 30px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 215, 0, 0.3);
      display: inline-block;
      max-width: 90%;
      line-height: 1.6;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.15);
      backdrop-filter: blur(10px);
    }

    .controls-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-bottom: 40px;
    }

    .tab-buttons {
      display: flex;
      background: rgba(255, 255, 255, 0.03);
      padding: 6px;
      border-radius: 40px;
      border: 1px solid var(--border-color);
      backdrop-filter: blur(10px);
    }

    .tab-btn {
      padding: 10px 28px;
      border-radius: 30px;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--accent-pink), #800020);
      color: #fff;
      box-shadow: 0 0 15px var(--glow-pink);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .loading-status {
      text-align: center;
      padding: 40px;
      color: var(--accent-rose);
      font-family: 'Cinzel', serif;
      letter-spacing: 2px;
      font-size: 0.95rem;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 18px;
    }

    .photo-card {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      backdrop-filter: blur(5px);
    }

    .photo-card:hover {
      transform: scale(1.06);
      border-color: var(--accent-pink);
      box-shadow: 0 0 25px var(--glow-pink);
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 22px;
    }

    .video-card {
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      backdrop-filter: blur(5px);
    }

    .video-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-pink);
      box-shadow: 0 0 30px var(--glow-pink);
    }

    .video-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      opacity: 0.65;
    }

    .play-icon {
      position: absolute;
      width: 46px;
      height: 46px;
      background: rgba(255, 42, 112, 0.85);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      backdrop-filter: blur(5px);
      box-shadow: 0 0 20px var(--accent-pink);
    }

    .watermark-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        45deg,
        rgba(255, 255, 255, 0.02),
        rgba(255, 255, 255, 0.02) 8px,
        transparent 8px,
        transparent 16px
      );
      z-index: 2;
    }

    /* --- LIGHTBOX (LAYAR PENUH UTK LIHAT FOTO & PUTAR VIDEO) --- */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.94);
      backdrop-filter: blur(25px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 3000;
      padding: 20px;
    }

    .lightbox-content {
      position: relative;
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 0 50px var(--glow-pink);
    }

    .lightbox-content img, .lightbox-content video {
      max-width: 90vw;
      max-height: 85vh;
      display: block;
      object-fit: contain;
    }

    .close-lightbox {
      position: absolute;
      top: 20px;
      right: 25px;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      z-index: 3100;
      opacity: 0.7;
    }

    .close-lightbox:hover { opacity: 1; }
  </style>
</head>
<body>

  <div id="anti-screenshot-overlay">
    <span>TAMPILAN DILINDUNGI</span>
  </div>

  <canvas id="stars-canvas"></canvas>

  <div id="login-overlay">
    <div class="login-card">
      <h2>ARSIP ARDZXYZ</h2>
      <div class="login-quote">"Beberapa nama tetap menjadi doa, meski tak lagi bisa bersama."</div>
      <input type="password" id="password-input" placeholder="••••" maxlength="4">
      <div id="error-message" class="error-msg"></div>
      <button onclick="checkPassword()">BUKA MEMORI</button>
    </div>
  </div>

  <div id="main-content">
    <header>
      <h1>ETERNAL MEMORIES</h1>
      <div class="quote-banner">"Meski kisah kita telah usai, senyummu akan selalu menjadi jejak terindah dalam perjalanan Ardzxyz."</div>
    </header>

    <div class="controls-container">
      <div class="tab-buttons">
        <button class="tab-btn active" onclick="switchTab('photos')">📷 Potret Kenangan</button>
        <button class="tab-btn" onclick="switchTab('videos')">🎬 Momen Abadi</button>
      </div>
    </div>

    <div id="photos-tab" class="tab-content active">
      <div id="photo-loading" class="loading-status">Memindai memori dari GitHub...</div>
      <div class="photo-grid" id="photo-gallery"></div>
    </div>

    <div id="videos-tab" class="tab-content">
      <div id="video-loading" class="loading-status">Memindai memori dari GitHub...</div>
      <div class="video-grid" id="video-gallery"></div>
    </div>
  </div>

  <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
    <span class="close-lightbox" onclick="closeLightbox(event)">&times;</span>
    <div class="lightbox-content" onclick="event.stopPropagation()">
      <div class="watermark-overlay"></div>
      <div id="lightbox-media-container"></div>
    </div>
  </div>

  <script>
    // Konfigurasi otomatis untuk repositori Ardzxyz/Arsip-ardzxyzz
    const GITHUB_USERNAME = "Ardzxyz";
    const GITHUB_REPO = "Arsip-ardzxyzz";
    const MEDIA_FOLDER_PATH = "media";

    // Canvas Animasi Bintang
    const canvas = document.getElementById('stars-canvas');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function createStars() {
      stars = [];
      const count = Math.floor((canvas.width * canvas.height) / 3000);
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.5,
          alpha: Math.random(),
          speed: Math.random() * 0.02 + 0.005
        });
      }
    }
    createStars();

    function animateStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(star => {
        star.alpha += star.speed;
        if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;

        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 215, 225, ${Math.abs(star.alpha)})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#ff758c';
        ctx.fill();
      });
      requestAnimationFrame(animateStars);
    }
    animateStars();

    // Logika Password (Default: 1007)
    const CORRECT_PASSWORD = "1007";

    function checkPassword() {
      const input = document.getElementById('password-input').value;
      const errorMsg = document.getElementById('error-message');
      
      if (input === CORRECT_PASSWORD) {
        errorMsg.innerText = '';
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
        autoFetchMediaFromGithub();
      } else {
        errorMsg.innerText = 'masukin password yang bener sayang☺️';
        document.getElementById('password-input').value = '';
      }
    }

    document.getElementById('password-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkPassword();
    });

    function switchTab(type) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      if (type === 'photos') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('photos-tab').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('videos-tab').classList.add('active');
      }
    }

    // MEMINDAI DAN MENAMPILKAN SEMUA FOTO & VIDEO OTOMATIS DARI GITHUB REST API
    async function autoFetchMediaFromGithub() {
      const photoGallery = document.getElementById('photo-gallery');
      const videoGallery = document.getElementById('video-gallery');
      const photoLoading = document.getElementById('photo-loading');
      const videoLoading = document.getElementById('video-loading');

      const apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${MEDIA_FOLDER_PATH}`;

      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error('Folder media belum dibuat atau belum ada file.');
        
        const files = await response.json();

        photoGallery.innerHTML = '';
        videoGallery.innerHTML = '';
        photoLoading.style.display = 'none';
        videoLoading.style.display = 'none';

        let photoCount = 0;
        let videoCount = 0;

        files.forEach(file => {
          if (file.type !== 'file') return;
          const extension = file.name.split('.').pop().toLowerCase();
          const fileUrl = file.download_url;

          // Memisahkan berdasarkan ekstensi gambar / video
          if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'heic'].includes(extension)) {
            photoCount++;
            const card = document.createElement('div');
            card.className = 'photo-card';
            card.onclick = () => openLightbox('image', fileUrl);
            card.innerHTML = `
              <img src="${fileUrl}" alt="Foto" loading="lazy">
              <div class="watermark-overlay"></div>
            `;
            photoGallery.appendChild(card);

          } else if (['mp4', 'webm', 'ogg', 'mov', 'mkv'].includes(extension)) {
            videoCount++;
            const card = document.createElement('div');
            card.className = 'video-card';
            card.onclick = () => openLightbox('video', fileUrl);
            card.innerHTML = `
              <video src="${fileUrl}#t=0.5" preload="metadata"></video>
              <div class="play-icon">▶</div>
              <div class="watermark-overlay"></div>
            `;
            videoGallery.appendChild(card);
          }
        });

        if (photoCount === 0) photoGallery.innerHTML = '<div class="loading-status">Belum ada foto di folder media/</div>';
        if (videoCount === 0) videoGallery.innerHTML = '<div class="loading-status">Belum ada video di folder media/</div>';

      } catch (error) {
        console.error(error);
        photoLoading.innerText = 'Folder "media" tidak ditemukan atau masih kosong.';
        videoLoading.innerText = 'Folder "media" tidak ditemukan atau masih kosong.';
      }
    }

    // Buka Lightbox Layar Penuh (Memutar Video / Melihat Foto)
    function openLightbox(type, src) {
      const lightbox = document.getElementById('lightbox');
      const container = document.getElementById('lightbox-media-container');
      container.innerHTML = '';

      if (type === 'image') {
        const img = document.createElement('img');
        img.src = src;
        container.appendChild(img);
      } else {
        const video = document.createElement('video');
        video.src = src;
        video.controls = true;
        video.autoplay = true;
        video.setAttribute('controlsList', 'nodownload noremoteplayback');
        video.setAttribute('disablePictureInPicture', 'true');
        container.appendChild(video);
      }
      lightbox.style.display = 'flex';
    }

    function closeLightbox(event) {
      const lightbox = document.getElementById('lightbox');
      document.getElementById('lightbox-media-container').innerHTML = '';
      lightbox.style.display = 'none';
    }

    // Proteksi Blur Otomatis saat ganti tab / screenshot
    const overlay = document.getElementById('anti-screenshot-overlay');

    function triggerProtection() {
      document.body.classList.add('screenshot-shield');
      if (overlay) overlay.style.display = 'flex';
    }

    function removeProtection() {
      document.body.classList.remove('screenshot-shield');
      if (overlay) overlay.style.display = 'none';
    }

    window.addEventListener('blur', triggerProtection);
    window.addEventListener('focus', removeProtection);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        triggerProtection();
      } else {
        removeProtection();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'PrintScreen' || e.keyCode === 44) {
        triggerProtection();
        if (navigator.clipboard) navigator.clipboard.writeText('');
        setTimeout(removeProtection, 2000);
      }
    });

    window.addEventListener('keydown', (e) => {
      if (
        (e.key === 'PrintScreen') ||
        (e.metaKey && e.shiftKey) ||
        (e.ctrlKey && e.key === 'p') ||
        (e.ctrlKey && e.key === 's') ||
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
        (e.ctrlKey && (e.key === 'u' || e.key === 'U'))
      ) {
        e.preventDefault();
        triggerProtection();
        setTimeout(removeProtection, 2000);
      }
    });

    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('dragstart', (e) => e.preventDefault());
  </script>
</body>
</html>
